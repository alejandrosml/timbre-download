# Hide Timbre's earlier versions in the official MCP Registry: every version
# but the one to keep is marked "deleted", which takes it out of the
# registry's listings (the registry keeps the record itself; nothing can be
# erased by a publisher). Run it by hand: Actions → Registry status → Run
# workflow. `restore` puts a version back ("active").
name: Registry status

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Version to keep listed, like 0.7.5 (every other one is hidden)"
        required: true
      restore:
        description: "Or: a version to list again, like 0.7.4 (then `keep` is ignored)"
        required: false

permissions: {}

jobs:
  status:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # proves to the registry whose repository this is
    env:
      KEEP: ${{ inputs.keep }}
      RESTORE: ${{ inputs.restore }}
      NAME: io.github.alejandrosml/timbre
      # mcp-publisher v1.8.9, linux/amd64, as in the release's checksums file.
      PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - name: Install mcp-publisher
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/publisher.tgz" "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
      - name: Change the status
        run: |
          ok='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ -n "$RESTORE" ]; then
            [[ "$RESTORE" =~ $ok ]] || { echo "::error::not a version: $RESTORE"; exit 1; }
            "$RUNNER_TEMP/mcp-publisher" status --status active "$NAME" "$RESTORE"
            exit 0
          fi
          [[ "$KEEP" =~ $ok ]] || { echo "::error::not a version: $KEEP"; exit 1; }
          VERSIONS="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/io.github.alejandrosml%2Ftimbre/versions" \
            | jq -r '.servers[].server.version' | sort -u)"
          echo "listed now:"; echo "$VERSIONS"
          echo "$VERSIONS" | grep -qx "$KEEP" || { echo "::error::$KEEP is not listed: nothing is hidden"; exit 1; }
          for v in $VERSIONS; do
            if [ "$v" != "$KEEP" ]; then
              echo "hiding $v"
              "$RUNNER_TEMP/mcp-publisher" status --status deleted \
                --message "Superseded: only the latest version of Timbre is published." "$NAME" "$v"
            fi
          done
