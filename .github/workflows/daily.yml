# The only workflow of this repository, scheduled once a day, at 20:07,
# Paris time. GitHub starts scheduled workflows late, often hours late (6 to
# 9 hours in November 2026), and skips some: the hour of a run is GitHub's,
# not the maintainer's, and the next day's run takes what a run did not do.
# A run re-run by hand would start at the hour of the click: every job but
# cleanup (which only removes this run's artifacts) refuses a run that
# GitHub's schedule did not start, or a second attempt. Never re-run it.
#
# A version of Timbre is prepared as a draft release vX.Y.Z, in two steps,
# and each day's run takes the step that is due:
#
# 1. The draft holds timbre-X.Y.Z-build.zip, made on the maintainer's Mac by
#    the Release workflow of Timbre's own repository: Timbre.app (signed ad
#    hoc) and timbre-X.Y.Z-source.zip. The tests that need a clean Mac run
#    on that source (Timbre replacing itself with a newer release, Timbre
#    Signer), the Claude extension is packed (mcpb, an npm package pinned in
#    mcpb/package-lock.json: on this throw-away machine, never on the
#    maintainer's Mac), and the draft is left with timbre-X.Y.Z.mcpb, signed
#    ad hoc, for Timbre Signer, and the source archive.
# 2. The draft holds timbre-X.Y.Z-signed.mcpb, which Timbre Signer made on
#    the maintainer's Mac: the release's five files are made from it (the
#    app must be signed with Timbre's Developer ID and notarized), they
#    replace the draft's files, and the version is published.
#
# Code that is not this repository's or Timbre's own (cargo's build scripts,
# npm packages, mcp-publisher) runs in jobs whose token cannot write to this
# repository (mcp-publisher also gets the OIDC token the registry asks for).
# They get their files from the jobs that can, as artifacts of the run,
# dated of the latest 20:07 (scripts/redate.py) and removed at its end,
# whatever happened.
#
# At each run, the version published here is then listed in the official
# MCP Registry (registry.modelcontextprotocol.io), the other versions are
# hidden there, and the releases that came before are removed: this
# repository holds the latest version only. GitHub's OIDC token proves the
# repository is alejandrosml's, so the name io.github.alejandrosml/timbre
# needs no secret.
#
# Events made with this workflow's own token start no other workflow, which
# is why publishing and listing are done here, one job after the other.
name: Daily

on:
  schedule:
    - cron: "7 20 * * *"
      timezone: "Europe/Paris"

permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

env:
  ONCE: |
    if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
      echo "::error::Daily runs when GitHub's schedule starts it, once (this is attempt $GITHUB_RUN_ATTEMPT of a $GITHUB_EVENT_NAME run). Never re-run it by hand: the next day's run takes the step again."
      exit 1
    fi

jobs:
  plan:
    name: What is due
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # keeps this schedule alive
      contents: write # sees the draft (drafts are seen by writers only)
    outputs:
      step: ${{ steps.plan.outputs.step }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      release_id: ${{ steps.plan.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - name: Keep the schedule alive
        # GitHub turns a public repository's schedules off after 60 days
        # without activity; enabling the workflow again starts that count
        # over.
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable" \
            || echo "::warning::could not keep the schedule alive"
      - name: The draft, if any
        id: plan
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          n="$(jq '[.[] | select(.draft)] | length' releases.json)"
          step=none tag="" version="" id=""
          if [ "$n" -gt 1 ]; then
            echo "::error::$n draft releases: keep one, the version to publish"
            exit 1
          fi
          if [ "$n" -eq 1 ]; then
            tag="$(jq -r '.[] | select(.draft) | .tag_name' releases.json)"
            id="$(jq -r '.[] | select(.draft) | .id' releases.json)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the draft's tag is not a version: $tag"; exit 1; }
            version="${tag#v}"
            # Publishing an older version would remove the newer one.
            newest="$(jq -r '.[] | select(.draft | not) | .tag_name' releases.json | sort -V | tail -n 1)"
            if [ -n "$newest" ]; then
              top="$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -n 1)"
              if [ "$newest" = "$tag" ] || [ "$top" != "$tag" ]; then
                echo "::error::$newest is published here: the draft $tag must be newer"
                exit 1
              fi
            fi
            names="$(jq -r '.[] | select(.draft) | .assets[].name' releases.json)"
            echo "Draft $tag: ${names//$'\n'/ }"
            has() { grep -qxF "$1" <<<"$names"; }
            # The package's presence marks the first step as done; the
            # signed package, or SHA256SUMS left by a run that stopped
            # half-way, the second as due.
            if has "timbre-$version-signed.mcpb" || has SHA256SUMS; then
              step=finish
            elif has "timbre-$version.mcpb"; then
              echo "::notice::$tag waits for timbre-$version-signed.mcpb (Timbre Signer)."
            elif has "timbre-$version-build.zip"; then
              step=pack
            else
              echo "::notice::$tag holds neither timbre-$version-build.zip nor timbre-$version-signed.mcpb: nothing to do."
            fi
          fi
          echo "Step: $step"
          { echo "step=$step"; echo "tag=$tag"; echo "version=$version"; echo "release_id=$id"; } >> "$GITHUB_OUTPUT"

  fetch:
    name: Hand the draft's build to the jobs that test and pack it
    needs: plan
    if: needs.plan.outputs.step == 'pack'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # reads the draft's files (drafts are seen by writers only)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The draft's build
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/draft.sh get "timbre-$VERSION-build.zip" "$RUNNER_TEMP/build.zip"
      - name: Its two files, dated of the latest 20:07
        run: |
          set -euo pipefail
          # The artifacts of a run can be downloaded by anyone signed in to
          # GitHub while they last: what is handed over carries no hour of
          # the work (the build zip, the source and the app are dated of the
          # commit and of the build).
          cd "$RUNNER_TEMP"
          unzip -q build.zip -d build
          [ "$(find build -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort | tr '\n' ' ')" = "Timbre.app.tar timbre-$VERSION-source.zip " ] \
            || { echo "::error::timbre-$VERSION-build.zip must hold Timbre.app.tar and timbre-$VERSION-source.zip, and nothing else"; ls build; exit 1; }
          mkdir handover
          python3 -I "$GITHUB_WORKSPACE/scripts/redate.py" zip "build/timbre-$VERSION-source.zip" "handover/timbre-$VERSION-source.zip"
          python3 -I "$GITHUB_WORKSPACE/scripts/redate.py" tar build/Timbre.app.tar handover/Timbre.app.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/handover/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Clean-Mac tests of the version's source
    needs: [plan, fetch]
    if: needs.plan.outputs.step == 'pack'
    runs-on: macos-15
    timeout-minutes: 60
    permissions: {} # cargo runs build scripts: no token that can do anything
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build
      - name: The version's source
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/build/timbre-$VERSION-source.zip" -d "$RUNNER_TEMP"
          SRC="$RUNNER_TEMP/timbre-$VERSION"
          for t in self-update signer; do
            [ -f "$SRC/tests/$t.sh" ] || { echo "::error::the source has no tests/$t.sh"; exit 1; }
          done
          echo "SRC=$SRC" >> "$GITHUB_ENV"
      - name: Timbre replaces itself only with its own, intact release
        run: bash "$SRC/tests/self-update.sh"
      - name: Timbre Signer
        run: bash "$SRC/tests/signer.sh"

  pack:
    name: Pack the Claude extension
    needs: [plan, fetch, test]
    if: needs.plan.outputs.step == 'pack'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # npm runs here: a token that can only read this public repository
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build
      - name: What was built is this version, for both kinds of Mac, with its source
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          SOURCE="build/timbre-$VERSION-source.zip"
          python3 -I -c 'import re, sys, zipfile; c = zipfile.ZipFile(sys.argv[1]).comment.decode(); sys.exit(not re.fullmatch("[0-9a-f]{40}", c))' "$SOURCE" \
            || { echo "::error::$SOURCE does not name its commit (scripts/package-source.sh)"; exit 1; }
          unzip -q "$SOURCE" -d .
          grep -q "MIT License" "timbre-$VERSION/LICENSE" || { echo "::error::the source has no MIT licence"; exit 1; }
          grep -qx "version = \"$VERSION\"" "timbre-$VERSION/Cargo.toml" || { echo "::error::the source is not that of $VERSION"; exit 1; }
          mkdir app && tar -xf build/Timbre.app.tar -C app
          python3 -I - app/Timbre.app/Contents/Info.plist "$VERSION" <<'PY'
          import plistlib, sys
          info = plistlib.load(open(sys.argv[1], "rb"))
          assert info["CFBundleIdentifier"] == "io.github.alejandrosml.timbre", info["CFBundleIdentifier"]
          assert info["CFBundleShortVersionString"] == sys.argv[2], info["CFBundleShortVersionString"]
          PY
          python3 -I "$GITHUB_WORKSPACE/scripts/check-universal.py" app/Timbre.app
      - name: Pack, on this machine thrown away after the job
        run: |
          set -euo pipefail
          # The packer and its whole tree, as pinned; no install script runs.
          mkdir -p "$RUNNER_TEMP/mcpb"
          cp mcpb/package.json mcpb/package-lock.json "$RUNNER_TEMP/mcpb/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/mcpb"
          PATH="$RUNNER_TEMP/mcpb/node_modules/.bin:$PATH"
          SRC="$RUNNER_TEMP/timbre-$VERSION"
          "$SRC/scripts/package-mcpb.sh" "$RUNNER_TEMP/app/Timbre.app"
          # Handed over dated of the latest 20:07, as every artifact of the
          # run (mcpb dates the files of the hour of packing); store checks it
          # all the same.
          mkdir -p "$RUNNER_TEMP/package"
          python3 -I scripts/redate.py zip "$SRC/dist/timbre-$VERSION.mcpb" "$RUNNER_TEMP/package/timbre-$VERSION.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/timbre-${{ needs.plan.outputs.version }}.mcpb
          if-no-files-found: error
          retention-days: 1

  store:
    name: Check the package against the draft's build, and leave it in the draft
    needs: [plan, pack]
    if: needs.plan.outputs.step == 'pack'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # reads the draft's files, then leaves the package in it
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: The draft's build, again, from the draft itself
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/scripts/draft.sh" get "timbre-$VERSION-build.zip" build.zip
          unzip -q build.zip -d build
          unzip -q "build/timbre-$VERSION-source.zip" -d .
          mkdir app && tar -xf build/Timbre.app.tar -C app
      - name: The package holds what was built, and nothing else
        run: |
          python3 -I - "$RUNNER_TEMP" "$VERSION" <<'PY'
          import os, sys, zipfile
          root, version = sys.argv[1], sys.argv[2]
          src = os.path.join(root, f"timbre-{version}")
          want = {
              "manifest.json": os.path.join(src, "packaging", "manifest.json"),
              "icon.png": os.path.join(src, "assets", "icon.png"),
              "LICENSE": os.path.join(src, "LICENSE"),
          }
          app = os.path.join(root, "app")
          for base, _, files in os.walk(os.path.join(app, "Timbre.app")):
              for name in files:
                  path = os.path.join(base, name)
                  want["server/" + os.path.relpath(path, app)] = path
          with zipfile.ZipFile(os.path.join(root, "package", f"timbre-{version}.mcpb")) as z:
              got = {i.filename: i for i in z.infolist() if not i.filename.endswith("/")}
              assert set(got) == set(want), sorted(set(got) ^ set(want))
              for name, path in want.items():
                  assert z.read(name) == open(path, "rb").read(), name
              mode = got["server/Timbre.app/Contents/MacOS/timbre"].external_attr >> 16
              assert mode & 0o111, oct(mode)
          print(len(got), "files, as built")
          PY
      - name: Dated of the latest 20:07, the source, then the package, in the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Inside both, every file is dated of the latest 20:07, Paris time
          # (mcpb dates them of the hour of packing, git archive of the
          # commit's). The package last: its presence marks this step done.
          mkdir "$RUNNER_TEMP/out"
          python3 -I scripts/redate.py zip "$RUNNER_TEMP/build/timbre-$VERSION-source.zip" "$RUNNER_TEMP/out/timbre-$VERSION-source.zip"
          python3 -I scripts/redate.py zip "$RUNNER_TEMP/package/timbre-$VERSION.mcpb" "$RUNNER_TEMP/out/timbre-$VERSION.mcpb"
          scripts/draft.sh put "$RUNNER_TEMP/out/timbre-$VERSION-source.zip"
          scripts/draft.sh put "$RUNNER_TEMP/out/timbre-$VERSION.mcpb"
          scripts/draft.sh rm "timbre-$VERSION-build.zip"
          echo "The draft now holds: $(scripts/draft.sh names | tr '\n' ' ')"

  cleanup:
    name: Remove this run's artifacts
    needs: [plan, fetch, test, pack, store]
    # Whatever happened before: the version's source and app must not stay
    # downloadable. Removing leaves nothing public, at any hour.
    if: always() && needs.plan.outputs.step == 'pack'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # removes this run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove them
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          ids="$(gh api "$api" --jq '.artifacts[].id')"
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          left="$(gh api "$api" --jq .total_count)"
          [ "$left" = 0 ] || { echo "::error::$left artifacts left: they stay downloadable a day"; exit 1; }
          echo "No artifact left."

  finish:
    name: The release's files, then publish
    needs: plan
    if: needs.plan.outputs.step == 'finish'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # the draft's files, and publishing it
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The signed package and the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # The package Timbre Signer made, or, after a run that
          # stopped half-way, the signed copy already under its final name
          # (an ad hoc one is refused below).
          if scripts/draft.sh names | grep -qxF "timbre-$VERSION-signed.mcpb"; then
            scripts/draft.sh get "timbre-$VERSION-signed.mcpb" "$RUNNER_TEMP/timbre-$VERSION-signed.mcpb"
          else
            scripts/draft.sh get "timbre-$VERSION.mcpb" "$RUNNER_TEMP/timbre-$VERSION-signed.mcpb"
          fi
          scripts/draft.sh get "timbre-$VERSION-source.zip" "$RUNNER_TEMP/out/timbre-$VERSION-source.zip"
      - name: The release's five files, from the signed package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unzip -q "out/timbre-$VERSION-source.zip" -d .
          grep -q "MIT License" "timbre-$VERSION/LICENSE" || { echo "::error::the source has no MIT licence"; exit 1; }
          grep -qx "version = \"$VERSION\"" "timbre-$VERSION/Cargo.toml" || { echo "::error::the source is not that of $VERSION"; exit 1; }
          # The source's own tool: nothing is made unless Timbre.app is the
          # one signed with Timbre's Developer ID, notarized and universal
          # (codesign and spctl too, on this Mac).
          "timbre-$VERSION/scripts/package-extras.sh" "$RUNNER_TEMP/timbre-$VERSION-signed.mcpb" "$RUNNER_TEMP/out"
          ls -l out
          for f in "timbre-$VERSION.mcpb" "Timbre-$VERSION.zip" timbre-mail-skill.zip "timbre-$VERSION-source.zip" SHA256SUMS; do
            [ -f "out/$f" ] || { echo "::error::no $f"; exit 1; }
          done
          [ "$(find out -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 5 ] || { echo "::error::five files, and no other"; exit 1; }
          # This repository's own checks, whatever that source says.
          python3 -I "$GITHUB_WORKSPACE/scripts/check-universal.py" "out/timbre-$VERSION.mcpb" "out/Timbre-$VERSION.zip"
          python3 -I "$GITHUB_WORKSPACE/scripts/check-release-app.py" "$VERSION" "out/timbre-$VERSION.mcpb" "out/Timbre-$VERSION.zip"
          [ "$(wc -l < out/SHA256SUMS | tr -d ' ')" -eq 4 ] || { echo "::error::SHA256SUMS lists four files"; exit 1; }
          (cd out && shasum -a 256 -c SHA256SUMS)
      - name: These five files in the draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Each file goes in place of the file of its name, uploaded now by
          # this run; the source archive, left by the first step, stays
          # (taking it out first would leave the draft without it).
          for f in SHA256SUMS "Timbre-$VERSION.zip" timbre-mail-skill.zip "timbre-$VERSION.mcpb"; do
            scripts/draft.sh put "$RUNNER_TEMP/out/$f"
          done
          # Then nothing else: the signed package under Timbre Signer's
          # name, or anything an earlier run left.
          scripts/draft.sh names | while read -r name; do
            [ -f "$RUNNER_TEMP/out/$name" ] || scripts/draft.sh rm "$name"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | "\(.name) \(.size)"' \
            | LC_ALL=C sort > online.txt
          (cd "$RUNNER_TEMP/out" && for f in *; do echo "$f $(stat -f %z "$f")"; done) | LC_ALL=C sort > here.txt
          diff here.txt online.txt || { echo "::error::the draft does not hold exactly the five files"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true \
            --jq '"published \(.tag_name), \(.html_url)"'


  registry:
    name: Listed in the MCP Registry, the other versions hidden
    needs: [plan, finish]
    if: always() && needs.plan.result == 'success' && (needs.finish.result == 'success' || needs.finish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # mcp-publisher runs here: a token that can only read this public repository
      id-token: write # proves to the registry whose repository this is
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: io.github.alejandrosml/timbre
      REGISTRY: https://registry.modelcontextprotocol.io/v0/servers/io.github.alejandrosml%2Ftimbre
      # mcp-publisher v1.8.9, linux/amd64, as in the release's checksums file.
      PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Anything to do
        id: state
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the latest release is not a version: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          LISTED="$(curl -fsSL --retry 3 "$REGISTRY/versions" | jq -r '.servers[].server.version' | sort -u | tr '\n' ' ')"
          echo "Published here: $TAG; listed in the registry: ${LISTED:-none}"
          todo=true
          if [ "$LISTED" = "$VERSION " ]; then todo=false; fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "listed=$LISTED"; echo "todo=$todo"; } >> "$GITHUB_OUTPUT"
      - name: The published release's files
        if: steps.state.outputs.todo == 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          mkdir files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
          ls -l files
          SOURCE="timbre-$VERSION-source.zip"
          for f in "timbre-$VERSION.mcpb" "Timbre-$VERSION.zip" timbre-mail-skill.zip "$SOURCE" SHA256SUMS; do
            [ -f "files/$f" ] || { echo "::error::the release has no $f"; exit 1; }
          done
          # Both kinds of Mac; signed with Timbre's Developer ID, notarized
          # (ticket stapled), Timbre's identifier, this version: an app
          # signed ad hoc would reach the registry, and the page would
          # refuse it. scripts/check-release-app.py is a copy of the one in
          # Timbre's own repository: keep the two the same.
          python3 -I scripts/check-universal.py "files/timbre-$VERSION.mcpb" "files/Timbre-$VERSION.zip"
          python3 -I scripts/check-release-app.py "$VERSION" "files/timbre-$VERSION.mcpb" "files/Timbre-$VERSION.zip"
          (cd files && sha256sum --check --strict SHA256SUMS) \
            || { echo "::error::SHA256SUMS does not match the release's files"; exit 1; }
          # Timbre is open source by its versions: the source of this one,
          # with its licence, or nothing is listed.
          unzip -q "files/$SOURCE" "timbre-$VERSION/LICENSE" "timbre-$VERSION/Cargo.toml" -d "$RUNNER_TEMP/source" \
            || { echo "::error::$SOURCE has no licence or no Cargo.toml"; exit 1; }
          grep -q "MIT License" "$RUNNER_TEMP/source/timbre-$VERSION/LICENSE" \
            || { echo "::error::$SOURCE has no MIT licence"; exit 1; }
          grep -qx "version = \"$VERSION\"" "$RUNNER_TEMP/source/timbre-$VERSION/Cargo.toml" \
            || { echo "::error::$SOURCE is not the source of $VERSION"; exit 1; }
      - name: Install mcp-publisher
        if: steps.state.outputs.todo == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/publisher.tgz" "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
      - name: List it in the MCP Registry
        if: steps.state.outputs.todo == 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          if curl -fsS -o /dev/null "$REGISTRY/versions/$VERSION"; then
            echo "$NAME $VERSION is listed."
          elif curl -fsS -o /dev/null "$REGISTRY/versions/$VERSION?include_deleted=true"; then
            # Listed once, hidden since: shown again. A version can be
            # listed once only.
            "$RUNNER_TEMP/mcp-publisher" status --status active "$NAME" "$VERSION"
          else
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/timbre-${VERSION}.mcpb"
            SHA="$(sha256sum "files/timbre-$VERSION.mcpb" | cut -d' ' -f1)"
            jq --arg v "$VERSION" --arg u "$URL" --arg s "$SHA" \
              '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
              server.json > "$RUNNER_TEMP/server.json"
            mv "$RUNNER_TEMP/server.json" server.json
            cat server.json
            "$RUNNER_TEMP/mcp-publisher" publish
          fi
          # Listed now, or nothing else is hidden.
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "$REGISTRY/versions/$VERSION"; then exit 0; fi
            sleep 10
          done
          echo "::error::$NAME $VERSION is not listed"
          exit 1
      - name: Hide the other versions there
        if: steps.state.outputs.todo == 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
          LISTED: ${{ steps.state.outputs.listed }}
        run: |
          set -euo pipefail
          for v in $LISTED; do
            if [ "$v" != "$VERSION" ]; then
              echo "hiding $v"
              "$RUNNER_TEMP/mcp-publisher" status --status deleted \
                --message "Superseded: only the latest version of Timbre is published." "$NAME" "$v"
            fi
          done

  prune:
    name: Nothing older kept here
    needs: registry
    # Once the latest version is listed, and not before.
    if: always() && needs.registry.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # removes the earlier releases and their tags
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Started by the schedule, once
        run: eval "$ONCE"
      - name: Remove the earlier releases
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the latest release is not a version: $TAG"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' | while read -r old; do
            if [ "$old" != "$TAG" ]; then
              echo "removing $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag < /dev/null
            fi
          done
